name: Profile Activity & Releases Sync

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: profile-activity-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-activity:
    name: Sync Genuine Public Activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Profile Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Execute Activity & Release Synchronization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          README_PATH: README.md
        run: |
          python scripts/update_activity.py

      - name: Commit and Push Changes If Modified
        run: |
          if git diff --quiet README.md; then
            echo "No profile activity or release changes detected. Zero-commit idempotency maintained."
          else
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(profile): sync public activity and releases [skip ci]"
            git push
          fi
